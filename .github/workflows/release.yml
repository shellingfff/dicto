name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: 2.12.6

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release version
        id: version
        run: node .github/scripts/release-version.mjs

  build-linux:
    needs: version
    # Build against an older glibc baseline, not rolling Arch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf file libfuse2 squashfs-tools \
            gstreamer1.0-plugins-good gstreamer1.0-alsa gstreamer1.0-pulseaudio
      - name: Build AppImage with bundled media support
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} build --ci --bundles appimage -- --locked
      - name: Collect AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          images=(target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          cp "${images[0]}" "dist/dicto-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: dicto-linux
          path: dist/*.AppImage
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build NSIS installer with WebView2 bootstrapper
        working-directory: desktop
        shell: bash
        run: npx --yes @tauri-apps/cli@${TAURI_CLI_VERSION} build --ci --bundles nsis -- --locked
      - name: Collect installer and portable ZIP
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, portable | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          Copy-Item $installers[0].FullName "dist/dicto-$env:VERSION-windows-x86_64-installer.exe"
          Copy-Item target/release/dicto.exe, LICENSE, README.md portable/
          Compress-Archive -Path portable/* -DestinationPath "dist/dicto-$env:VERSION-windows-x86_64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dicto-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
